services:
  - type: web
    name: paper-pulse-web
    runtime: node
    rootDir: web-paper-pulse
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SYNC_SECRET
        generateValue: true
      - key: EASYSCHOLAR_SECRET_KEY
        sync: false
      - key: EASYSCHOLAR_USERNAME
        sync: false
      - key: EASYSCHOLAR_PASSWORD
        sync: false
      - key: EASYSCHOLAR_MAX_LOOKUPS
        value: "20"
